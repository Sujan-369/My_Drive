name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Run `dotnet format` locally once and commit the result
      # BEFORE enabling this step, or it will fail immediately on
      # existing formatting it doesn't like.
      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Check package.json for the exact lint script name Vite's
      # scaffold generated (likely `lint`, running oxlint under the hood).
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-validate:
    name: Docker image builds cleanly
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (validation only, not pushed anywhere)
        run: docker build -f My_Drive/Dockerfile -t my-drive-api:validate .

  deploy-api:
    name: Deploy API to Container Apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker-validate]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ACR_NAME: mydriveacrsujan282
      RESOURCE_GROUP: my-drive-rg
      CONTAINER_APP: my-drive-api
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (tagged with the commit SHA)
        run: az acr build --registry $ACR_NAME --image my-drive-api:${{ github.sha }} --file My_Drive/Dockerfile .

      - name: Roll out the new image
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/my-drive-api:${{ github.sha }} \
            --set-env-vars \
              "Jwt__Issuer=my-drive-api" \
              "Jwt__Audience=my-drive-client" \
              "Google__ClientId=${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
              "Cors__AllowedOrigins__0=${{ vars.FRONTEND_ORIGIN }}"

  deploy-frontend:
    name: Deploy frontend to Static Web Apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker-validate]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist
          skip_app_build: true
          skip_api_build: true
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Run `dotnet format` locally once and commit the result
      # BEFORE enabling this step, or it will fail immediately on
      # existing formatting it doesn't like.
      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Check package.json for the exact lint script name Vite's
      # scaffold generated (likely `lint`, running oxlint under the hood).
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-validate:
    name: Docker image builds cleanly
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (validation only, not pushed anywhere)
        run: docker build -f My_Drive/Dockerfile -t mydrive-api:ci .

  # deploy:
  #   Added in Sprint 6 once Azure resources (Container Registry,
  #   Container App / VM Scale Set) actually exist. Needs: [backend, frontend, docker-validate].
  #   Will build + push a tagged image, then deploy that exact tag —
  #   not rebuild at deploy time — so what's tested is what ships.
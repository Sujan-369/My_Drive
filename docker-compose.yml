services:
  postgres:
    image: postgres:16
    container_name: mydrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mydrive
      POSTGRES_PASSWORD: mydrive_dev_password
      POSTGRES_DB: mydrive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mydrive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: mydrive-azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  redis_data:
  azurite_data: